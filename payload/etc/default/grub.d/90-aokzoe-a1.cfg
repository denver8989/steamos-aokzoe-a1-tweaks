# Stock entries provide a display fallback; the earlier A1 entry adds its own settings.
if [ "$(cat /sys/class/dmi/id/sys_vendor 2>/dev/null)" = AOKZOE ] && [ "$(cat /sys/class/dmi/id/product_name 2>/dev/null)" = 'AOKZOE A1 AR07' ] && [ ! -e /etc/aokzoe-a1/disabled ]; then
  GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT aokzoe_a1.stock=1"
  GRUB_TIMEOUT=5
fi
